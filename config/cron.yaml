# Scheduled jobs — managed by `rainier jobs` CLI
# Each job runs via cron-wrapper.sh which provides:
#   - Timestamped logging ([START], [OK], [FAIL])
#   - Discord alert on failure (if discord_on_failure: true)
#   - Auto cd to project directory (cron starts in /)
#
# QU scraper requires Chrome with --remote-debugging-port=9222 to bypass bot
# detection. Each scrape job starts Chrome headless before scraping and kills
# it after, so Chrome only runs during the ~1-2 min each scrape takes.

# Discord webhook for ops alerts (loaded from .env DISCORD_WEBHOOK_URL)
discord_on_failure: true

jobs:
  - name: fetch-mes
    description: "Fetch MES data from yfinance and regenerate daytrade chart"
    schedule: "*/5 * * * *"    # every 5 minutes
    command: "uv run rainier fetch --symbol MES && uv run rainier daytrade --symbol MES --data-dir data/csv"
    log: "data/fetch.log"
    enabled: true

  # Chrome stays running all day — scrape jobs just connect via CDP.
  # scripts/ensure-chrome.sh starts Chrome only if not already running.

  - name: qu-morning
    description: "Scrape QU100 morning session (ET 11:30 update → PT 08:45)"
    schedule: "45 8 * * 1-5"    # 08:45 PST Mon-Fri
    command: "scripts/ensure-chrome.sh && uv run rainier scrape qu --session morning --cdp http://127.0.0.1:9222"
    log: "data/qu-scrape.log"
    enabled: true

  - name: qu-midday
    description: "Scrape QU100 midday session (ET 13:30 update → PT 10:45)"
    schedule: "45 10 * * 1-5"   # 10:45 PST Mon-Fri
    command: "scripts/ensure-chrome.sh && uv run rainier scrape qu --session midday --cdp http://127.0.0.1:9222"
    log: "data/qu-scrape.log"
    enabled: true

  - name: qu-afternoon
    description: "Scrape QU100 afternoon session (ET 15:30 update → PT 12:45)"
    schedule: "45 12 * * 1-5"   # 12:45 PST Mon-Fri
    command: "scripts/ensure-chrome.sh && uv run rainier scrape qu --session afternoon --cdp http://127.0.0.1:9222"
    log: "data/qu-scrape.log"
    enabled: true

  - name: qu-close
    description: "Scrape QU100 close session (ET 17:30 update → PT 15:00) + DB coverage audit"
    schedule: "0 15 * * 1-5"    # 15:00 PST Mon-Fri
    # Chains the coverage audit after the scrape so cron-wrapper.sh's
    # existing non-zero-exit → Discord alert path catches both scrape
    # failures AND coverage gaps. Coverage exit codes per
    # docs/TASK-PLAN-qu-money-flow-backfill-ea9d.md §Acceptance:
    #   0  = no missing days in tail-7 (or 1 missing = warning)
    #   1  = >1 missing in tail-7 OR table empty → fires Discord alert
    # The coverage report's tail-1500-chars lands in the Discord embed so
    # the operator can see which dates are missing without opening the log.
    command: "scripts/ensure-chrome.sh && uv run rainier scrape qu --session close --cdp http://127.0.0.1:9222 && uv run rainier qu money-flow-coverage"
    log: "data/qu-scrape.log"
    enabled: true

  # Thematic Ranks dashboard — DESIGN-thematic-ranks-dashboard.md §7 [D-004].
  # Runs 15min after NYSE close (16:30 ET / 13:30 PT) on weekdays. Idempotent
  # `run-daily` short-circuits if today's Layer A row is already present, so
  # cron retries are safe.
  #
  # Full chain (mirrors the breadth twin `market-breadth-daily`):
  #   1. `thematic backfill --incremental` — fetch the last few calendar days
  #      of OHLCV and upsert on (symbol, date) into the existing
  #      data/cache/thematic_universe.parquet IN PLACE (no --force cohort).
  #      This advances max(date) to today so run-daily's stale-OHLCV guard
  #      (cli._check_ohlcv_freshness) passes on the very next step.
  #   2. `thematic run-daily` — compute Layer A+B + render the dashboard.
  #
  # `&&` enforces serial execution and propagates the first non-zero exit to
  # cron-wrapper.sh, which fires the Discord alert (discord_on_failure below).
  # Previously DISABLED because step 2 alone hit the stale-OHLCV guard every
  # weekday (the cache was never refreshed); the --incremental refresh resolves
  # that (thematic-daily-cron-wire), so this is now enabled.
  - name: thematic-ranks-daily
    description: "Refresh thematic OHLCV + compute thematic ranks (Layer A+B) + render dashboard"
    schedule: "30 13 * * 1-5"   # 13:30 PST = 16:30 ET, Mon-Fri
    command: "uv run rainier thematic backfill --incremental && uv run rainier thematic run-daily"
    log: "data/thematic-ranks.log"
    discord_on_failure: true
    enabled: true

  # ETF names cache refresh — DESIGN-etf-dashboard-name-column.md §3.4.
  #
  # The ETF dashboard's Name column reads from data/cache/etf_names.parquet.
  # Names rarely change so we refresh on a 30-day stale window: `--refresh-stale`
  # is a no-op when the parquet is < 30 days old, keeping daily yfinance load
  # near zero. The one-shot initial seed is operator-run via
  # `uv run rainier thematic backfill-names`; from there cron keeps it fresh.
  #
  # Slot 12:35 — 5 min before the ETF publish job below so a refresh-day
  # write is in place by the time the publish chain renders the HTML.
  - name: etf-names-refresh
    description: "Refresh ETF names cache (yfinance longName) if >30 days old"
    schedule: "35 12 * * 1-5"   # 12:35 PST, 5 min before etf-dashboard-publish
    command: "uv run rainier thematic backfill-names --refresh-stale"
    log: "data/etf-names-refresh.log"
    discord_on_failure: true
    enabled: true

  # ETF ranks dashboard — DESIGN-etf-dashboard-publish.md §4/§5.
  # 20 min before US market close: render today's snapshot, publish to
  # fengshen.dev/trading/etf-ranks/ via git push to fengshen-site (Cloudflare
  # Pages auto-deploys on push). The publish step is a no-op when the
  # rendered HTML didn't change (market holiday, identical day), so cron
  # retries are safe.
  #
  # The chain lives in scripts/publish-etf-dashboard.sh so the crontab line
  # never contains `%` — cron's command field treats unescaped `%` as a
  # line terminator + stdin marker, which would silently truncate the job.
  # The script also guards against publishing an empty render (no data for
  # `asof`), which the renderer produces as a valid-but-empty HTML page.
  #
  # DATA DEPENDENCY: this job reads `data/cache/thematic_features_daily.parquet`
  # for today's asof_date. That file is updated by `thematic-ranks-daily`
  # above, which (a) is currently `enabled: false` pending daily OHLCV refresh
  # wiring, AND (b) is scheduled at 13:30 PT (post-close) while this publish
  # job runs at 12:40 PT (pre-close, per the design's "20 min pre-close
  # snapshot" intent). Even after OHLCV is wired, the producer would need a
  # pre-close compute pass — or this job would need to render the latest
  # available asof — for today's data to be ready at 12:40 PT.
  #
  # RETIRED 2026-06-03 (retire-fengshen-dashboar-aec0): fengshen's PG-backed
  # /trading is now the canonical source, so this pure git-push-HTML publisher
  # is dead weight (and caused daily "target working tree dirty" failures). The
  # ETF PG write it depended on lives in `thematic-ranks-daily`, which STAYS
  # enabled — so disabling this loses no market.* data. scripts/publish-etf-
  # dashboard.sh is left on disk (unreferenced) for a later cleanup.
  - name: etf-dashboard-publish
    description: "RETIRED — legacy ETF ranks publish to fengshen-site (PG write lives in thematic-ranks-daily)"
    schedule: "40 12 * * 1-5"   # 12:40 PST, Mon-Fri (20 min pre-close)
    command: "scripts/publish-etf-dashboard.sh"
    log: "data/etf-dashboard.log"
    discord_on_failure: true
    enabled: false

  # S&P 500 breadth-webpage child series — daily OHLCV refresh.
  # docs/DESIGN-market-breadth-webpage.md §3.2.
  #
  # 12:40 PT is the breadth-webpage publish chain anchor: this incremental
  # refresh runs BEFORE the (future) render step so today's bar is already
  # in the parquet when the renderer reads it. Self-healing 5-day window
  # forgives a missed cron yesterday.
  #
  # SLOT CONFLICT (40 12 * * 1-5): `etf-dashboard-publish` above shares this
  # slot. cron spawns both jobs concurrently when both are enabled; YAML
  # ordering here does NOT enforce serial execution (jobs.py installs each
  # as an independent crontab line). The two jobs touch different parquet
  # caches (`sp500_universe.parquet` vs. `thematic_features_daily.parquet`)
  # so concurrent execution is safe today, but if a future render step on
  # the breadth side reads `sp500_universe.parquet`, schedule it on a later
  # minute (e.g., `45 12`) so this refresh has finished writing.
  #
  # PREREQUISITE: the one-shot full-history backfill that seeds
  # data/cache/sp500_universe.parquet must have run on this host BEFORE this
  # cron is active. The incremental first run fetches only the last 5 calendar
  # days, but compute-indicators needs long history (50/100/200-day MAs,
  # 52-week highs/lows) — without the seed the published dashboard would be
  # mostly NaN. Enabled here because the operator's deployment host is already
  # seeded (breadth dashboard is live). On a fresh host, run the one-shot seed
  # first or flip this back to `enabled: false` until the seed completes.
  - name: market-breadth-daily
    description: "Refresh sp500 OHLCV + compute breadth indicators (writes market.breadth_indicator_daily)"
    schedule: "45 12 * * 1-5"   # 12:45 PST Mon-Fri (15 min pre-close)
    # This job is COMPUTE-ONLY since 2026-06-03 (retire-fengshen-dashboar-aec0):
    # the `&& scripts/publish-market-breadth.sh` tail was dropped because
    # fengshen's PG-backed /trading is now the canonical source and no longer
    # reads git-pushed HTML. The two compute steps are KEPT — they write
    # market.breadth_indicator_daily, which fengshen reads.
    #
    # Compute chain (DESIGN-market-breadth-webpage.md §6, publish step retired):
    #   1. yfinance incremental refresh -> data/cache/sp500_universe.parquet
    #   2. indicator recompute          -> market.breadth_indicator_daily
    #
    # `&&` enforces serial execution and propagates the first non-zero exit
    # to cron-wrapper.sh, which fires the Discord alert (discord_on_failure
    # below).
    command: "uv run rainier market-breadth backfill-ohlcv --incremental && uv run rainier market-breadth compute-indicators"
    log: "data/market-breadth.log"
    discord_on_failure: true
    enabled: true

  # Combined trading dashboard — DESIGN-trading-dashboard-combined-v1.md.
  # Publishes /trading/ (one URL, shared header + Breadth / ETF
  # Ranks top-level tabs — D1: operator override 2026-05-27 "the url will
  # be /trading"). Runs AFTER `etf-dashboard-publish` (12:40) and
  # `market-breadth-daily` (12:45) so both source parquets are fresh.
  #
  # Slot 12:50: serialized after the two upstream publishers to avoid the
  # `publish-dashboard.sh` "target working tree dirty" race (each publisher
  # commits to the same fengshen-site checkout; only one can hold it at a
  # time).
  #
  # WALL-CLOCK DEPENDENCIES (jobs.py installs each job as an independent
  # crontab line — no `depends_on:` graph). The schedule below assumes:
  #   - `etf-names-refresh`       (12:35 PT) — keeps data/cache/etf_names.parquet
  #                                fresh so the ETF tab's Name column shows
  #                                yfinance longName instead of the symbol
  #                                fallback (PR #100 / this PR).
  #   - `etf-dashboard-publish`   (12:40 PT) — refreshes the ETF features
  #                                parquet read by the combined render.
  #   - `market-breadth-daily`    (12:45 PT) — refreshes the breadth parquet.
  # 15-minute lead time on names-refresh leaves comfortable headroom; if
  # any of those slots shift, re-verify this job still runs LAST.
  #
  # D4 from the design: standalone URLs `/trading/etf-ranks/` and
  # `/trading/market-breadth/` keep publishing in addition to this one —
  # no 301 redirects. All three URLs go live on the same publish push
  # cadence; bookmarks survive the v1 combined launch.
  - name: trading-dashboard
    description: "Render combined trading dashboard (breadth + ETF) + publish to fengshen.dev/trading/"
    schedule: "50 12 * * 1-5"   # 12:50 PST Mon-Fri (5 min after market-breadth-daily)
    command: "scripts/publish-trading-dashboard.sh"
    log: "data/trading-dashboard.log"
    discord_on_failure: true
    enabled: false

  # Nightly money_flow_snapshots -> Neon backup (durability).
  # DESIGN-money-flow-neon-backup.md §2.4.
  #
  # The QU100 ranking history (money_flow_snapshots) lives ONLY on the local
  # TimescaleDB and is irreplaceable (QU's date-keyed endpoint has no intraday/
  # session replay). This job copies it incrementally (high-water-mark by id,
  # insert-only, idempotent) into a plain backup.money_flow_snapshots table on
  # Neon, which has managed backups. Local stays primary; Neon is a backup copy.
  #
  # 15:30 PT runs AFTER qu-close (15:00 PT) lands the day's final ranking, so
  # the backup includes today's data. --verify runs a strong integrity check
  # (max-id, missing-row, full-window canonicalized checksum, id-uniqueness);
  # any drift exits non-zero so cron-wrapper.sh fires the Discord alert
  # (durability failures must be LOUD). The job does NOT pass
  # --skip-if-unconfigured, so an unset DATABASE_URL fails loud in prod.
  - name: money-flow-backup
    description: "Nightly money_flow_snapshots → Neon backup (durability)"
    schedule: "30 15 * * 1-5"   # 15:30 PST, after qu-close (15:00) lands final rows
    command: "uv run rainier db backup-money-flow --verify"
    log: "data/money-flow-backup.log"
    discord_on_failure: true
    enabled: true
