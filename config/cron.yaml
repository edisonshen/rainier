# Scheduled jobs — managed by `rainier jobs` CLI
# Each job runs via cron-wrapper.sh which provides:
#   - Timestamped logging ([START], [OK], [FAIL])
#   - Discord alert on failure (if discord_on_failure: true)
#   - Auto cd to project directory (cron starts in /)
#
# QU scraper requires Chrome with --remote-debugging-port=9222 to bypass bot
# detection. Each scrape job starts Chrome headless before scraping and kills
# it after, so Chrome only runs during the ~1-2 min each scrape takes.

# Discord webhook for ops alerts (loaded from .env DISCORD_WEBHOOK_URL)
discord_on_failure: true

jobs:
  - name: fetch-mes
    description: "Fetch MES data from yfinance and regenerate daytrade chart"
    schedule: "*/5 * * * *"    # every 5 minutes
    command: "uv run rainier fetch --symbol MES && uv run rainier daytrade --symbol MES --data-dir data/csv"
    log: "data/fetch.log"
    enabled: true

  # Chrome stays running all day — scrape jobs just connect via CDP.
  # scripts/ensure-chrome.sh starts Chrome only if not already running.

  - name: qu-morning
    description: "Scrape QU100 morning session (ET 11:30 update → PT 08:45)"
    schedule: "45 8 * * 1-5"    # 08:45 PST Mon-Fri
    command: "scripts/ensure-chrome.sh && uv run rainier scrape qu --session morning --cdp http://127.0.0.1:9222"
    log: "data/qu-scrape.log"
    enabled: true

  - name: qu-midday
    description: "Scrape QU100 midday session (ET 13:30 update → PT 10:45)"
    schedule: "45 10 * * 1-5"   # 10:45 PST Mon-Fri
    command: "scripts/ensure-chrome.sh && uv run rainier scrape qu --session midday --cdp http://127.0.0.1:9222"
    log: "data/qu-scrape.log"
    enabled: true

  - name: qu-afternoon
    description: "Scrape QU100 afternoon session (ET 15:30 update → PT 12:45)"
    schedule: "45 12 * * 1-5"   # 12:45 PST Mon-Fri
    command: "scripts/ensure-chrome.sh && uv run rainier scrape qu --session afternoon --cdp http://127.0.0.1:9222"
    log: "data/qu-scrape.log"
    enabled: true

  - name: qu-close
    description: "Scrape QU100 close session (ET 17:30 update → PT 15:00) + DB coverage audit"
    schedule: "0 15 * * 1-5"    # 15:00 PST Mon-Fri
    # Chains the coverage audit after the scrape so cron-wrapper.sh's
    # existing non-zero-exit → Discord alert path catches both scrape
    # failures AND coverage gaps. Coverage exit codes per
    # docs/TASK-PLAN-qu-money-flow-backfill-ea9d.md §Acceptance:
    #   0  = no missing days in tail-7 (or 1 missing = warning)
    #   1  = >1 missing in tail-7 OR table empty → fires Discord alert
    # The coverage report's tail-1500-chars lands in the Discord embed so
    # the operator can see which dates are missing without opening the log.
    command: "scripts/ensure-chrome.sh && uv run rainier scrape qu --session close --cdp http://127.0.0.1:9222 && uv run rainier qu money-flow-coverage"
    log: "data/qu-scrape.log"
    enabled: true

  # Thematic Ranks dashboard — DESIGN-thematic-ranks-dashboard.md §7 [D-004].
  # Runs 15min after NYSE close (16:30 ET / 13:30 PT) on weekdays. Idempotent
  # `run-daily` short-circuits if today's Layer A row is already present, so
  # cron retries are safe.
  #
  # DISABLED until a daily OHLCV refresh job lands (codex iter-7 [P1]).
  # `run-daily` needs `data/cache/thematic_universe.parquet` to be current
  # for today's asof. The Phase A `backfill_thematic_universe.py` is a
  # one-shot bulk fetch (no `--resume`/--update mode) and is revision-
  # immutable (`--force` writes a sibling cohort, not in-place). Until the
  # backfill script grows a daily-refresh mode (deferred follow-up), enabling
  # this cron would hit the stale-OHLCV guard and fail every weekday.
  # Operator flips `enabled: true` once daily OHLCV refresh is wired up;
  # `run-daily` itself remains operator-runnable via the CLI for ad-hoc use.
  - name: thematic-ranks-daily
    description: "Compute thematic ranks (Layer A+B) + render dashboard"
    schedule: "30 13 * * 1-5"   # 13:30 PST = 16:30 ET, Mon-Fri
    command: "uv run rainier thematic run-daily"
    log: "data/thematic-ranks.log"
    discord_on_failure: true
    enabled: false
