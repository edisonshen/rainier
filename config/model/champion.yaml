# config/model/champion.yaml — the LIVE screener model (WS C).
#
# One versioned file IS the model. The loader (core/champion.py) deep-merges
#   code defaults  <-  settings.yaml:stock_screener  <-  champion.yaml
# (champion wins per-key) before constructing StockScreenerConfig, and is
# hooked into load_settings (so both get_settings and load_settings_fresh see
# it). A promotion is a new champion.yaml: version++, parent=old, score
# recorded, prior file retained in config/model/history/.
#
# WS1 seeds this byte-identical to today's effective stock_screener config, so
# wiring the loader is behavior-preserving (proven by a parity test). NO weight
# or threshold value is changed in WS1.

# --- metadata header (stripped before model construction) ---
version: 1
parent: null
created: 2026-06-16
note: "WS1 seed — byte-identical to settings.yaml:stock_screener (behavior-preserving)"
score: null

