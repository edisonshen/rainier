# Alembic config for rainier's canonical-store Postgres schema.
#
# DATABASE_URL is read from the environment by db/alembic/env.py, NOT from
# this file. Keeping `sqlalchemy.url` empty here avoids leaking creds into
# git and matches the 12-factor pattern.

[alembic]
# `%(here)s` resolves to the directory containing this ini file, so
# `alembic -c db/alembic.ini revision --autogenerate -m "foo"` from the
# repo root finds db/alembic/ correctly. Without %(here)s, alembic
# interprets the path as relative to cwd and fails.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/..
path_separator = os
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]
# (none — we don't auto-format generated migrations.)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
