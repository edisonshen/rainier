[project]
name = "rainier"
version = "0.2.0"
description = "Trading analysis platform — futures price action + stock money flow"
requires-python = ">=3.12"
dependencies = [
    # Core
    "click>=8.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Data
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=1.2.0",
    "ib_insync>=0.9.86",
    # Database
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    # Visualization
    "plotly>=5.18",
    "kaleido==0.2.1",
    # Web scraping
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    # Scheduling
    "apscheduler>=3.10",
    # LLM
    "litellm>=1.40",
    # Notifications
    "httpx>=0.27",
    "apprise>=1.9.8",
    # Logging
    "structlog>=24.0",
    "exchange-calendars>=4.13.2",
    "pyarrow>=23.0.1",
    "xgboost>=3.2.0",
    "shap>=0.51.0",
    "hmmlearn>=0.3.3",
    "scikit-learn>=1.8.0",
    # Stats — Mann-Whitney U for per-signal contribution test in eval.py
    "scipy>=1.11",
    # Round-trip YAML for the auto-research accept handler — preserves
    # comments + key order when ACTION_EXECUTORS mutate config/settings.yaml.
    "ruamel.yaml>=0.18",
]

[project.scripts]
rainier = "rainier.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rainier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "llm_integration: real-LLM end-to-end (skipped unless RAINIER_LLM_INTEGRATION_TEST=1)",
    "requires_postgres: tests that need a live Postgres DB",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# Pre-existing tech debt parked so CI runs on net-new code; clean up incrementally.
# - E501 (line too long): 44 hits, mostly long log strings; fix in a follow-up
# - E741 (ambiguous var name like `l`/`I`): 18 hits, scientific code convention
# - N806 (lowercase var name): 10 hits, ditto
ignore = ["E501", "E741", "N806"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30,<2"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]
