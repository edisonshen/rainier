[project]
name = "rainier"
version = "0.2.0"
description = "Trading analysis platform — futures price action + stock money flow"
requires-python = ">=3.12"
dependencies = [
    # Core
    "click>=8.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Data
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=1.2.0",
    "ib_insync>=0.9.86",
    # Database
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    # psycopg3 driver for the canonical-store pivot (postgresql+psycopg://...).
    # psycopg2-binary is kept for the legacy core/database.py path so existing
    # ORM call sites don't have to migrate in this PR; new db/ code uses psycopg3.
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    # Visualization
    "plotly>=5.18",
    "kaleido==0.2.1",
    # Web scraping
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    # Scheduling
    "apscheduler>=3.10",
    # LLM
    "litellm>=1.40",
    # Notifications
    "httpx>=0.27",
    "apprise>=1.9.8",
    # Logging
    "structlog>=24.0",
    "exchange-calendars>=4.13.2",
    "pyarrow>=23.0.1",
    "xgboost>=3.2.0",
    "shap>=0.51.0",
    "hmmlearn>=0.3.3",
    "scikit-learn>=1.8.0",
    # Stats — Mann-Whitney U for per-signal contribution test in eval.py
    "scipy>=1.11",
    # JIT — TQQQ/SQQQ SMA sweep inner loop (~3.35M backtests, ~0.3ms each).
    # 0.59 is the floor that supports our @njit(cache=True) usage; 0.64+ ships
    # on every platform we actually run on, and we let shap's tighter pin win
    # on python 3.14 + x86_64-darwin (a platform combo we never use).
    "numba>=0.59",
    # Round-trip YAML for the auto-research accept handler — preserves
    # comments + key order when ACTION_EXECUTORS mutate config/settings.yaml.
    "ruamel.yaml>=0.18",
    # HTML templating — used by the publish-friendly ETF dashboard renderer
    # at src/rainier/dashboard/render_etf.py. Already transitively present
    # via streamlit; declaring it directly so the renderer doesn't silently
    # depend on the streamlit-extras transitive graph.
    "jinja2>=3.1",
]

[project.scripts]
rainier = "rainier.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rainier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "llm_integration: real-LLM end-to-end (skipped unless RAINIER_LLM_INTEGRATION_TEST=1)",
    "requires_postgres: tests that need a live Postgres DB",
    "slow: spawns subprocesses or takes >1s (selectable with -m slow / -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# Pre-existing tech debt parked so CI runs on net-new code; clean up incrementally.
# - E501 (line too long): 44 hits, mostly long log strings; fix in a follow-up
# - E741 (ambiguous var name like `l`/`I`): 18 hits, scientific code convention
# - N806 (lowercase var name): 10 hits, ditto
ignore = ["E501", "E741", "N806"]

[tool.ruff.lint.per-file-ignores]
# Spec-named identifiers `buy_T`, `sell_T`, `buy_S`, `sell_S` (long/short legs).
# Renaming to ruff-friendly lowercase would diverge from the task spec + the
# parquet column names; keep the casing and waive N802/N803 here.
"src/rainier/backtest/tqqq_sma_sweep.py" = ["N802", "N803"]
"src/rainier/backtest/tqqq_sma_report.py" = ["N802", "N803"]
"tests/test_tqqq_sma_sweep.py" = ["N802", "N803", "N806"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30,<2"]
# RL — gymnasium env for ThematicTradingEnv. Lazy-imported only when the env
# is constructed; not required for compute / dashboard / cron paths.
rl = ["gymnasium>=0.29"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    # Spins up a temporary local Postgres for db/ migration tests. Tests
    # tagged `requires_postgres` skip when this isn't available, so it's
    # dev-only.
    "pytest-postgresql>=6.0",
    "ruff>=0.3",
]
