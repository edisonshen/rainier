# Output-format contract — D-031 stdout summary blocks.
#
# Every llm-research <verb> that emits a summary block produces a YAML
# document fenced by `---` ... `---` on stdout. The contents must match
# one of the schemas below. CI tests validate every backtest run against
# this file (per [D-031]).
#
# Schema entries declare each field's type and (optionally) an enum of
# allowed values. Unknown verdicts / outcomes fail strict-mode validation
# in the test suite; the runtime CLI uses non-strict mode so a forward-
# compatible field doesn't blow up production stdout.

schema_version: 1

schemas:
  # Slice 0 — cost-pilot summary, per TASK-PLAN §4.3.
  cost_pilot:
    fields:
      slice:
        type: int
      skill_id:
        type: str
      calls_total:
        type: int
      calls_completed:
        type: int
      mean_cost_usd:
        type: float
      p95_cost_usd:
        type: float
      p99_cost_usd:
        type: float
      schema_retry_rate:
        type: float
      cache_hit_rate:
        type: float
      total_spend_usd:
        type: float
      verdict:
        type: str
        enum: [PASS, CONDITIONAL, FAIL]
      report_html:
        type: str
      ledger_sha:
        type: str

  # Slice 0 — survivorship summary, per TASK-PLAN §4.4.
  survivorship:
    fields:
      from_date:
        type: str
      to_date:
        type: str
      verdict:
        type: str
        enum: [PASS, CONDITIONAL, FAIL]
      delisted_tickers:
        type: list
      missing_days:
        type: list
      next_step:
        type: str
        nullable: true

  # A/B substrate — candidate-agnostic base scorecard, per
  # DESIGN-qu100-ab-testing.md §10.5. Every evaluator (screener replay, LLM
  # backtest) emits this core; candidate-specific fields live in extension
  # schemas composed via output_schema.validate_composed().
  base_scorecard:
    fields:
      candidate_id:
        type: str
      candidate_type:
        type: str
      window:
        type: str
      n_selection_days:
        type: int
      corpus_hash:
        type: str
      # Reward values keyed by role: {primary: {...}, guardrails: {...},
      # secondary: {...}} — reward keys are opaque strings here (§10.3).
      rewards:
        type: dict
      # Per-regime reward slices (regime tag -> reward values), §4.4.
      regime_scores:
        type: dict
      # ALWAYS null until the §11-task-6 DSR spec lands — never a naively
      # computed number (design §4.4).
      deflated_sharpe:
        type: float
        nullable: true
      evaluator_sha:
        type: str

  # A/B substrate — optional LLM extension composed on top of base_scorecard
  # (§10.5). Not required of the screener evaluator; the LLM-shaped
  # `backtest` entry below stays untouched for its existing consumer.
  llm_extension:
    fields:
      valid_thesis_rate:
        type: float
      cost_usd:
        type: float
      filled_R:
        type: float
      filled_rate:
        type: float
      tqqq_bh_R:
        type: float
      skill_yaml_sha:
        type: str

  # Slice 1+ — L3 backtest summary, per [D-031] in DESIGN-qu100-llm-backtest.md.
  # Declared here so subsequent slices don't drift on shape; not exercised
  # in Slice 0 tests beyond shape parity.
  backtest:
    fields:
      skill_id:
        type: str
      reward_fn:
        type: str
      filled_R:
        type: float
      all_call_R:
        type: float
      calls:
        type: int
      valid_thesis_rate:
        type: float
      filled_rate:
        type: float
      cost_usd:
        type: float
      tqqq_bh_R:
        type: float
      delta_vs_tqqq:
        type: float
      deflated_sharpe:
        type: float
      evaluator_sha:
        type: str
      skill_yaml_sha:
        type: str
      ledger_sha:
        type: str
